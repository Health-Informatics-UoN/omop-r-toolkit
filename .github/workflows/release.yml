# This workflow is used to release the project.
# It is triggered by a push to the main branch.
# It will publish an edge container image
# And run semantic release

name: Release
permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  id-token: write

on:
  push:
    branches:
      - main
      - feat-workflows

jobs:
   release:
     uses: health-informatics-uon/workflows/.github/workflows/semantic-release.yml@1.6.0
     with:
       node-version: "24"
     secrets: inherit

   publish-container:
     uses: health-informatics-uon/workflows/.github/workflows/publish-container.yml@1.6.0
     with:
       image-name: omop-R-tools
       image-description: "Container image for OMOP R tools"
       registry: ghcr.io
       context: .
       dockerfile: ./Dockerfile
       platforms: linux/amd64,linux/arm64
     secrets: inherit

   semver-container:
     uses: health-informatics-uon/workflows/.github/workflows/semver-container.yml@1.6.0
     needs: [release, publish-container]
     if: needs.release.outputs.release-created == 'true'
     with:
       image-name: omopRTools
       registry: ghcr.io
       tag: ${{ needs.release.outputs.release-tag }}
       tag-latest: true
     secrets: inherit
